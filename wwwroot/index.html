<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProspectCRM - Insurance Workspace</title>
    <script type="module">
    import { requireAuth } from '/js/auth/session.js';
    requireAuth();
</script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <link rel="stylesheet" href="/css/main.css?v=1.5">

    
    
</head>
<body class="bg-[#E8F1EE] font-sans text-gray-800 antialiased h-screen w-screen flex overflow-hidden">

    <!-- Mobile-only dark overlay, shown behind the sidebar drawer when it's open -->
    <div id="sidebar-overlay" class="sidebar-overlay hidden"></div>

    <aside id="app-sidebar" class="sidebar w-64 border-r border-gray-200 flex flex-col justify-between h-full p-5 flex-shrink-0 shadow-sm">
        
        <div class="space-y-6">
            <div class="flex items-center justify-between px-1">
                <div class="flex items-center gap-3">
                    <div class="brand-icon-box">
                        <i data-lucide="shield-check"></i>
                    </div>
                    <span class="text-lg font-bold tracking-tight text-white">AlimdadCRM</span>
                </div>
                <!-- Mobile-only close button for the drawer -->
                <button id="sidebar-close-btn" class="sidebar-close-btn">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="space-y-1">
                <span class="block text-[10px] font-bold text-gray-400 uppercase tracking-wider px-3 mb-2">Workspace</span>
                <nav class="space-y-0.5">
                    <a href="#" id="nav-prospects" data-view="prospects" class="sidebar-link active">
                        <i data-lucide="layout-dashboard"></i>
                        <span>Prospects Board</span>
                    </a>
                    <a href="#" id="nav-clients" data-view="clients" class="sidebar-link">
                        <i data-lucide="shield"></i>
                        <span>Clients Board</span>
                    </a>
                    <a href="#" id="nav-calculator" data-view="calculator" class="sidebar-link">
                        <i data-lucide="calculator"></i>
                        <span>Premium Calculator</span>
                    </a>
                </nav>
            </div>

            <div class="space-y-1">
                <span class="block text-[10px] font-bold text-gray-400 uppercase tracking-wider px-3 mb-2">Management</span>
                <nav class="space-y-0.5">
                    <a href="#" id="nav-commissions" data-view="commissions" class="sidebar-link">
                        <i data-lucide="wallet"></i>
                        <span>Commission Ledger</span>
                    </a>
                    <a href="#" id="nav-dropdowns" data-view="dropdowns" class="sidebar-link">
                        <i data-lucide="sliders"></i>
                        <span>Global Dropdowns</span>
                    </a>
                </nav>
            </div>
        </div>

       <div class="bg-gray-50 p-3.5 rounded-xl border border-gray-100 shadow-inner">
    <div class="flex items-center gap-2 mb-2 px-0.5 text-gray-400">
        <i data-lucide="fingerprint"></i>
        <span class="text-[10px] font-bold uppercase tracking-wider" id="access-scope-label">Access Scope</span>
    </div>
    <select id="agentSwitcher" class="w-full bg-white border border-gray-200 text-gray-700 rounded-lg py-1.5 px-2 text-xs font-bold shadow-sm focus:outline-none focus:ring-2 focus:ring-[#0D9488] transition-all">
        <option>Loading...</option>
    </select>
</div>

    </aside>

    <main class="flex-1 flex flex-col h-full overflow-hidden min-w-0">
        <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-4 md:px-8 flex-shrink-0 transition-colors duration-200">
            <div class="flex items-center gap-3 min-w-0">
                <!-- Mobile-only hamburger button to open the sidebar drawer -->
                <button id="sidebar-open-btn" class="sidebar-open-btn">
                    <i data-lucide="menu" class="w-5 h-5"></i>
                </button>
                <h1 class="navbar-h1 text-lg md:text-xl font-bold truncate" id="pageTitleContext">Prospects</h1>
            </div>
            
            <div class="flex items-center gap-3 md:gap-6 flex-shrink-0">
                
                <div class="hidden sm:flex items-center gap-3 border-r border-gray-200 pr-5">
                    <button id="themeToggleBtn" class="topbar-utility-btn" title="Toggle App Theme">
                        <i data-lucide="sun" id="themeIcon"></i>
                    </button>

                    <div class="relative">
                        <button id="notificationsBtn" class="topbar-utility-btn" title="Policy Expiry Alerts">
                            <i data-lucide="bell"></i>
                            <span id="notifications-badge" class="notifications-badge hidden"></span>
                        </button>
                        <div id="notifications-dropdown" class="notifications-dropdown hidden"></div>
                    </div>
                </div>

               <div class="relative">
                    <button id="user-menu-btn" class="flex items-center gap-2 md:gap-3 cursor-pointer">
                        <div class="text-right hidden sm:block">
                            <p class="text-xs font-semibold text-gray-900" id="currentUserName">—</p>
                            <p class="text-[10px] text-gray-400 font-medium" id="currentUserRole">—</p>
                        </div>
                        <div class="w-9 h-9 rounded-full bg-[#0D9488] text-white flex items-center justify-center font-bold text-sm shadow-sm shadow-teal-600/10 flex-shrink-0" id="currentUserInitials">
                            —
                        </div>
                    </button>

                    <div id="user-menu-dropdown" class="user-menu-dropdown hidden">
                        <button id="btn-logout" class="user-menu-item">
                            <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
                            <span>Log out</span>
                        </button>
                    </div>
                </div>

            </div>
        </header>

        <div id="app-content" class="flex-1 flex flex-col overflow-hidden">
            </div>
        
    </main>

    <script type="module" src="js/app.js"></script>
</body>
</html>
