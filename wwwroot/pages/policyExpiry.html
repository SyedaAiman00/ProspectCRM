<!-- POLICY EXPIRY WORKSPACE -->
<div class="px-6 pt-6 flex items-center justify-between flex-shrink-0 flex-wrap gap-3">
    <div>
        <h2 class="text-sm font-bold text-gray-700">Policy Expiry</h2>
        <p class="text-[11px] text-gray-400 mt-0.5">Review and manage policies by renewal month.</p>
    </div>
</div>

<!-- MONTH NAVIGATOR -->
<div class="px-6 pt-5 flex-shrink-0">
    <div class="bg-white rounded-xl border border-gray-200/80 shadow-sm px-4 py-3 flex items-center justify-between" id="pe-month-nav">
        <button type="button" id="pe-prev-month" class="topbar-utility-btn" title="Previous month">
            <i data-lucide="chevron-left"></i>
        </button>
        <h3 class="text-base font-bold text-gray-900" id="pe-month-label">—</h3>
        <button type="button" id="pe-next-month" class="topbar-utility-btn" title="Next month">
            <i data-lucide="chevron-right"></i>
        </button>
    </div>
</div>

<!-- MONTH SUMMARY -->
<div class="px-6 pt-5 flex-shrink-0" id="pe-summary"></div>

<!-- POLICY LIST -->
<div class="flex-1 px-6 py-5 overflow-y-auto space-y-3" id="pe-policy-list"></div>
