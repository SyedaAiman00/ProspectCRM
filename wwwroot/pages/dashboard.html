<!-- EXECUTIVE KPI OVERVIEW -->
 
<div class="px-6 pt-6 grid grid-cols-1 md:grid-cols-3 gap-5 flex-shrink-0">
    <!-- Card 1: Pipeline Value Ledger -->
    <div class="bg-white p-4 rounded-xl border border-gray-200/80 shadow-sm flex items-center justify-between transition-colors duration-200" id="kpi-card-value">
        <div class="space-y-1">
            <p class="text-[11px] text-gray-400 font-bold uppercase tracking-wider">Estimated Value</p>
            <h3 class="text-xl font-bold text-gray-900 tracking-tight" id="kpi-total-value">AED 0</h3>
        </div>
        <div class="w-10 h-10 rounded-lg bg-teal-50 flex items-center justify-center text-teal-600">
            <i data-lucide="wallet" class="w-5 h-5"></i>
        </div>
    </div>

    <!-- Card 2: Active Prospects Load -->
    <div class="bg-white p-4 rounded-xl border border-gray-200/80 shadow-sm flex items-center justify-between transition-colors duration-200" id="kpi-card-count">
        <div class="space-y-1">
            <p class="text-[11px] text-gray-400 font-bold uppercase tracking-wider">Active Portfolio Size</p>
            <h3 class="text-xl font-bold text-gray-900 tracking-tight" id="kpi-total-count">0 Prospects</h3>
        </div>
        <div class="w-10 h-10 rounded-lg bg-indigo-50 flex items-center justify-center text-indigo-600">
            <i data-lucide="users" class="w-5 h-5"></i>
        </div>
    </div>

    <!-- Card 3: Target Conversion Progression -->
    <div class="bg-white p-4 rounded-xl border border-gray-200/80 shadow-sm flex items-center justify-between transition-colors duration-200" id="kpi-card-target">
        <div class="space-y-1 flex-1">
            <div class="flex items-center justify-between">
                <p class="text-[11px] text-gray-400 font-bold uppercase tracking-wider">Monthly Conversion Target</p>
                <button id="btn-edit-target" class="text-gray-300 hover:text-teal-600 transition-colors" title="Edit target">
                    <i data-lucide="pencil" class="w-3 h-3"></i>
                </button>
            </div>
            <div class="flex items-baseline gap-2">
                <h3 class="text-xl font-bold text-gray-900 tracking-tight" id="kpi-target-text">0 / 5</h3>
                <span class="text-[10px] text-gray-400 font-semibold" id="kpi-target-pct">0% Achieved</span>
            </div>
            <div class="w-full bg-gray-100 h-1.5 rounded-full mt-2 overflow-hidden">
                <div class="bg-emerald-500 h-full rounded-full transition-all duration-500" id="kpi-target-bar" style="width: 0%"></div>
            </div>
        </div>
    </div>
</div>
