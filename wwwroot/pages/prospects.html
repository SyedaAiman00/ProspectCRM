<!-- EXECUTIVE KPI OVERVIEW -->
<div class="px-6 pt-6 grid grid-cols-1 md:grid-cols-3 gap-5 flex-shrink-0">

    <!-- Card 1: Pipeline Value Ledger -->
    <div class="bg-white p-4 rounded-xl border-2 border-teal-200 shadow-sm flex items-center justify-between transition-colors duration-200" id="kpi-card-value">
        <div class="space-y-1">
            <p class="text-[11px] text-gray-400 font-bold uppercase tracking-wider">Estimated Value</p>
            <h3 class="text-xl font-bold text-gray-900 tracking-tight" id="kpi-total-value">AED 0</h3>
        </div>
        <div class="w-10 h-10 rounded-lg bg-teal-50 flex items-center justify-center text-teal-600">
            <i data-lucide="wallet" class="w-5 h-5"></i>
        </div>
    </div>

    <!-- Card 2: Active Prospects Load -->
    <div class="bg-white p-4 rounded-xl border-2 border-indigo-200 shadow-sm flex items-center justify-between transition-colors duration-200" id="kpi-card-count">
        <div class="space-y-1">
            <p class="text-[11px] text-gray-400 font-bold uppercase tracking-wider">Active Portfolio Size</p>
            <h3 class="text-xl font-bold text-gray-900 tracking-tight" id="kpi-total-count">0 Prospects</h3>
        </div>
        <div class="w-10 h-10 rounded-lg bg-indigo-50 flex items-center justify-center text-indigo-600">
            <i data-lucide="users" class="w-5 h-5"></i>
        </div>
    </div>

    <!-- Card 3: Target Conversion Progression -->
    <div class="bg-white p-4 rounded-xl border-2 border-emerald-200 shadow-sm flex items-center justify-between transition-colors duration-200" id="kpi-card-target">
        <div class="space-y-1 flex-1">
            <div class="flex items-center justify-between">
                <p class="text-[11px] text-gray-400 font-bold uppercase tracking-wider">Monthly Conversion Target</p>
                <button id="btn-edit-target" class="text-gray-300 hover:text-teal-600 transition-colors" title="Edit target">
                    <i data-lucide="pencil" class="w-3 h-3"></i>
                </button>
            </div>
            <div class="flex items-baseline gap-2">
                <h3 class="text-xl font-bold text-gray-900 tracking-tight" id="kpi-target-text">0 / 5</h3>
                <span class="text-[10px] text-gray-400 font-semibold" id="kpi-target-pct">0% Achieved</span>
            </div>
            <div class="w-full bg-gray-100 h-1.5 rounded-full mt-2 overflow-hidden">
                <div class="bg-emerald-500 h-full rounded-full transition-all duration-500" id="kpi-target-bar" style="width: 0%"></div>
            </div>
        </div>
    </div>

</div>

<!-- PIPELINE KANBAN BOARD CANVAS AREA (4 COLUMNS) -->
<div class="flex-1 p-6 overflow-y-auto grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5 items-start" id="view-prospects-canvas">

    <!-- Column 1: New / Uncontacted (Pastel Pink) -->
    <div class="w-full bg-[#FCE7F3] rounded-2xl p-4 flex flex-col border border-pink-200/50">
        <div class="flex items-center justify-between mb-4 px-1">
            <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-pink-500"></span>
                <h3 class="font-bold text-sm text-pink-900">New Leads</h3>
            </div>
            <span class="bg-white/80 text-pink-700 text-xs px-2.5 py-0.5 rounded-full font-bold shadow-sm" id="count-new">0</span>
        </div>
        <div class="space-y-3 overflow-y-auto max-h-[55vh] pr-1 custom-kanban-stream" id="col-new"></div>
        <button id="btn-add-prospect" class="mt-3 w-full py-2.5 border-2 border-dashed border-pink-300 text-pink-700 hover:bg-white/40 rounded-xl text-xs font-semibold flex items-center justify-center gap-1.5 transition-all">
            <i data-lucide="plus" class="w-3.5 h-3.5"></i> Add New Prospect
        </button>
    </div>

    <!-- Column 2: Contacted / Reached (Pastel Orange/Amber) -->
    <div class="w-full bg-[#FEF3C7] rounded-2xl p-4 flex flex-col border border-amber-200/50">
        <div class="flex items-center justify-between mb-4 px-1">
            <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>
                <h3 class="font-bold text-sm text-amber-900">Contacted</h3>
            </div>
            <span class="bg-white/80 text-amber-700 text-xs px-2.5 py-0.5 rounded-full font-bold shadow-sm" id="count-contacted">0</span>
        </div>
        <div class="space-y-3 overflow-y-auto max-h-[55vh] pr-1 custom-kanban-stream" id="col-contacted"></div>
        <button id="btn-quick-outreach" class="mt-3 w-full py-2.5 border-2 border-dashed border-amber-300 text-amber-800 hover:bg-white/40 rounded-xl text-xs font-semibold flex items-center justify-center gap-1.5 transition-all">
            <i data-lucide="phone-call" class="w-3.5 h-3.5"></i> Log New Outreach
        </button>
    </div>

    <!-- Column 3: In Progress / Quoted (Pastel Lavender/Blue) -->
    <div class="w-full bg-[#E0E7FF] rounded-2xl p-4 flex flex-col border border-indigo-200/50">
        <div class="flex items-center justify-between mb-4 px-1">
            <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-indigo-500"></span>
                <h3 class="font-bold text-sm text-indigo-900">In Progress</h3>
            </div>
            <span class="bg-white/80 text-indigo-700 text-xs px-2.5 py-0.5 rounded-full font-bold shadow-sm" id="count-progress">0</span>
        </div>
        <div class="space-y-3 overflow-y-auto max-h-[55vh] pr-1 custom-kanban-stream" id="col-progress"></div>
        <button id="btn-quick-appointment" class="mt-3 w-full py-2.5 border-2 border-dashed border-indigo-300 text-indigo-800 hover:bg-white/40 rounded-xl text-xs font-semibold flex items-center justify-center gap-1.5 transition-all">
            <i data-lucide="calendar-plus" class="w-3.5 h-3.5"></i> Schedule Appointment
        </button>
    </div>

    <!-- Column 4: Qualified Leads (Pastel Mint) -->
    <div class="w-full bg-[#D1FAE5] rounded-2xl p-4 flex flex-col border border-emerald-200/50">
        <div class="flex items-center justify-between mb-4 px-1">
            <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                <h3 class="font-bold text-sm text-emerald-900">Qualified Leads</h3>
            </div>
            <span class="bg-white/80 text-emerald-700 text-xs px-2.5 py-0.5 rounded-full font-bold shadow-sm" id="count-qualified">0</span>
        </div>
        <div class="space-y-3 overflow-y-auto max-h-[55vh] pr-1 custom-kanban-stream" id="col-qualified"></div>
        <button id="btn-quick-close" class="mt-3 w-full py-2.5 border-2 border-dashed border-emerald-300 text-emerald-800 hover:bg-white/40 rounded-xl text-xs font-semibold flex items-center justify-center gap-1.5 transition-all">
            <i data-lucide="check-square" class="w-3.5 h-3.5"></i> Review Closed Pipeline
        </button>
    </div>

</div>
